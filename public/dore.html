<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تسجيل الطلاب | Redox</title>

    <!-- Bootstrap CSS & Icons & Animate -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap');

        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --success-color: #06d6a0;
            --warning-color: #ffb703;
            --danger-color: #e63946;
            --dark-color: #1e1e2f;
            --light-color: #f8f9fa;
            --gray-color: #6c757d;
            --card-bg: rgba(255, 255, 255, 0.95);
            --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-success: linear-gradient(135deg, #06d6a0 0%, #118ab2 100%);
            --gradient-warning: linear-gradient(135deg, #ffb703 0%, #fb8500 100%);
            --gradient-danger: linear-gradient(135deg, #e63946 0%, #9d0208 100%);
            --box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            --border-radius: 20px;
            --redox-navy: #101828;
            --redox-cyan: #16c7d9;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--gradient-primary);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            color: var(--dark-color);
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.1"><path fill="white" d="M50 0 L100 50 L50 100 L0 50 Z"/></svg>');
            background-size: 50px 50px;
            animation: moveBackground 20s linear infinite;
            pointer-events: none;
        }

        @keyframes moveBackground {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(50px, 50px) rotate(10deg); }
        }

        .container-fluid {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            width: 100%;
        }

        .scan-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .scan-header {
            background: var(--gradient-primary);
            color: white;
            padding: 25px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
            isolation: isolate;
        }

        .scan-header>* { position: relative; z-index: 1; }

        .brand-mark {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            padding: 8px 16px 8px 12px;
            border: 1px solid rgba(255, 255, 255, .3);
            border-radius: 999px;
            background: rgba(16, 24, 40, .25);
            color: #fff;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .brand-mark img {
            display: block;
            width: auto;
            height: 36px;
            max-width: 150px;
            object-fit: contain;
            border-radius: 6px;
        }

        .brand-mark-icon {
            display: inline-grid;
            place-items: center;
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--redox-cyan), #fff);
            color: var(--redox-navy);
            font-size: 1.15rem;
        }

        .school-slogan { opacity: .9; }

        .scan-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .school-logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid white;
            object-fit: cover;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .school-name {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .datetime-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 15px;
            margin-top: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .current-time {
            font-size: 2.5rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 5px;
        }

        .scan-area {
            padding: 30px;
            background: rgba(255, 255, 255, 0.5);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7);
        }

        .scan-input-wrapper {
            position: relative;
            max-width: 500px;
            margin: 0 auto;
        }

        .scan-input {
            width: 100%;
            padding: 20px 25px;
            font-size: 1.2rem;
            text-align: center;
            border: 3px solid #e9ecef;
            border-radius: 50px;
            background: white;
            transition: all 0.3s ease;
            font-family: 'Tajawal', sans-serif;
            letter-spacing: 2px;
        }

        .scan-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 5px rgba(67, 97, 238, 0.2);
            outline: none;
        }

        .virtual-student-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            padding: 20px;
            color: white;
            position: relative;
            overflow: hidden;
            margin: 20px 0;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
            animation: fadeInUp 0.5s ease-out;
        }

        .virtual-student-card:hover { transform: translateY(-5px); }

        .virtual-student-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            animation: rotate 15s linear infinite;
        }

        .privacy-blur {
            filter: blur(8px);
            transition: filter 0.8s ease;
            user-select: none;
        }

        .privacy-blur:hover { filter: blur(0px); }

        .card-chip {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 50px;
            height: 40px;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-chip i { font-size: 24px; color: #b8860b; }

        .student-avatar-large {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid white;
            object-fit: cover;
            margin: 0 auto 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.5s ease;
        }

        .student-avatar-large img { transition: filter 0.8s ease; }
        .student-avatar-large.blurred img { filter: blur(10px); }
        .student-avatar-large i { font-size: 50px; color: white; }

        .student-name-card {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 5px;
            text-align: center;
            transition: all 0.8s ease;
        }

        .student-name-card.blurred {
            filter: blur(8px);
            color: rgba(255, 255, 255, 0.3);
        }

        .student-id-card {
            font-size: 0.9rem;
            opacity: 0.9;
            text-align: center;
            font-family: monospace;
            letter-spacing: 2px;
            transition: all 0.8s ease;
        }

        .student-id-card.blurred {
            filter: blur(6px);
            opacity: 0.4;
        }

        .card-number {
            font-size: 1.2rem;
            font-family: monospace;
            letter-spacing: 3px;
            margin: 15px 0;
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 10px;
        }

        .card-expiry {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-size: 0.8rem;
            opacity: 0.8;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.1rem;
            margin: 20px 0;
            background: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        .status-ready { color: var(--success-color); border: 2px solid var(--success-color); }
        .status-scanning { color: var(--warning-color); border: 2px solid var(--warning-color); animation: pulse 1.5s infinite; }
        .status-success { color: var(--success-color); border: 2px solid var(--success-color); background: rgba(6, 214, 160, 0.1); }
        .status-error { color: var(--danger-color); border: 2px solid var(--danger-color); background: rgba(230, 57, 70, 0.1); }
        .status-warning { color: var(--warning-color); border: 2px solid var(--warning-color); background: rgba(255, 183, 3, 0.1); animation: pulseWarning 1s infinite; }
        .status-overdue { color: var(--danger-color); border: 2px solid var(--danger-color); background: rgba(230, 57, 70, 0.15); animation: pulseOverdue 1s infinite; }
        .status-completed { color: var(--primary-color); border: 2px solid var(--primary-color); background: rgba(67, 97, 238, 0.1); }

        @keyframes pulseWarning { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
        @keyframes pulseOverdue { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.03); opacity: 0.9; } 100% { transform: scale(1); opacity: 1; } }

        .action-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .btn-action {
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
        }

        .btn-action:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1); }
        .btn-primary-custom { background: var(--gradient-primary); color: white; }
        .btn-success-custom { background: var(--gradient-success); color: white; }
        .btn-warning-custom { background: var(--gradient-warning); color: white; }

        /* Alert Overlay */
        .alert-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeInOverlay 0.3s ease-out;
            backdrop-filter: blur(5px);
        }

        .alert-overlay.fade-out { animation: fadeOutOverlay 0.5s ease-out forwards; }

        @keyframes fadeInOverlay { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeOutOverlay { from { opacity: 1; } to { opacity: 0; } }

        .alert-box {
            background: white;
            border-radius: 30px;
            padding: 40px 50px;
            max-width: 600px;
            width: 95%;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
            animation: bounceIn 0.5s ease-out;
            border: 5px solid var(--danger-color);
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .alert-box.fade-out { animation: bounceOut 0.5s ease-out forwards; }

        @keyframes bounceOut {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); }
            100% { transform: scale(0.5); opacity: 0; }
        }

        .alert-box.registration-warning { border-color: var(--warning-color); }
        .alert-box.overdue-warning { border-color: var(--danger-color); }

        @keyframes bounceIn { 0% { transform: scale(0.5); opacity: 0; } 60% { transform: scale(1.05); } 100% { transform: scale(1); opacity: 1; } }

        .alert-box .alert-icon { font-size: 80px; margin-bottom: 20px; animation: shakeWarning 0.8s infinite; }
        .alert-box .alert-icon.danger { color: var(--danger-color); }
        .alert-box .alert-icon.warning { color: var(--warning-color); }

        @keyframes shakeWarning { 0% { transform: rotate(0deg); } 25% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } 100% { transform: rotate(0deg); } }

        .alert-box .alert-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 15px; }
        .alert-box .alert-title.danger { color: var(--danger-color); }
        .alert-box .alert-title.warning { color: var(--warning-color); }
        .alert-box .alert-message { font-size: 1.1rem; color: var(--dark-color); margin-bottom: 10px; line-height: 1.6; }

        .alert-box .alert-details {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 15px;
            margin: 15px 0;
            text-align: right;
        }

        .alert-box .alert-details .detail-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #eee;
            font-size: 0.95rem;
        }

        .alert-box .alert-details .detail-item:last-child { border-bottom: none; }
        .alert-box .alert-details .detail-label { color: var(--gray-color); font-weight: 500; }
        .alert-box .alert-details .detail-value { font-weight: 700; }
        .alert-box .alert-details .detail-value.danger { color: var(--danger-color); }
        .alert-box .alert-details .detail-value.warning { color: var(--warning-color); }

        .countdown-timer {
            display: inline-block;
            background: var(--primary-color);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-top: 10px;
            font-weight: 600;
        }

        .alert-box .btn-dismiss-alert {
            color: white;
            border: none;
            padding: 12px 40px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .alert-box .btn-dismiss-alert.danger { background: var(--gradient-danger); }
        .alert-box .btn-dismiss-alert.warning { background: var(--gradient-warning); }
        .alert-box .btn-dismiss-alert.success { background: var(--gradient-success); }
        .alert-box .btn-dismiss-alert:hover { transform: scale(1.05); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3); }
        .alert-box .btn-dismiss-alert:active { transform: scale(0.95); }

        .alert-message {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            min-width: 300px;
            max-width: 500px;
            padding: 15px 20px;
            border-radius: 10px;
            background: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideDown 0.3s ease-out;
        }

        .alert-message.fade-out { animation: slideUp 0.3s ease-out forwards; }

        @keyframes slideDown { from { opacity: 0; transform: translate(-50%, -20px); } to { opacity: 1; transform: translate(-50%, 0); } }
        @keyframes slideUp { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, -20px); } }

        .alert-success { border-right: 5px solid var(--success-color); }
        .alert-error { border-right: 5px solid var(--danger-color); }
        .alert-warning { border-right: 5px solid var(--warning-color); }
        .alert-info { border-right: 5px solid var(--primary-color); }

        .loading-spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(67, 97, 238, 0.2);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .footer {
            padding: 15px 30px;
            background: var(--dark-color) !important;
            color: rgba(255, 255, 255, 0.7) !important;
            text-align: center;
            font-size: 0.9rem;
        }

        .info-item {
            background: #f8f9fa;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 8px;
        }

        .info-label { font-size: 0.8rem; color: #6c757d; margin-bottom: 2px; }
        .info-value { font-size: 1rem; font-weight: 500; }

        .attendance-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .attendance-badge.present { background: #d1fae5; color: #065f46; }
        .attendance-badge.late { background: #fef3c7; color: #92400e; }
        .attendance-badge.absent { background: #fee2e2; color: #991b1b; }

        @media (max-width: 768px) {
            .school-name { font-size: 1.4rem; }
            .current-time { font-size: 2rem; }
            .student-name-card { font-size: 1.2rem; }
            .alert-box { padding: 25px 20px; }
            .alert-box .alert-title { font-size: 1.4rem; }
            .alert-box .alert-icon { font-size: 60px; }
            .action-buttons .btn-action { padding: 10px 18px; font-size: 0.9rem; }
            .scan-input { font-size: 1rem; padding: 15px 20px; }
        }

        @media (max-width: 480px) {
            body { padding: 10px; }
            .scan-header { padding: 15px 20px; }
            .scan-area { padding: 20px; }
            .alert-box { padding: 20px 15px; max-width: 100%; margin: 10px; border-radius: 20px; }
            .alert-box .alert-title { font-size: 1.2rem; }
            .alert-box .alert-icon { font-size: 50px; }
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="scan-card">
                    <!-- Header -->
                    <div class="scan-header">
                        <div class="d-flex justify-content-center">
                            <img src="/Redox.png" alt="شعار Redox" loading="eager" style="width: 100px; height: auto;">

                        </div>
            
                        <h1 class="school-name" id="schoolName">اسم المدرسة</h1>
                        <p class="school-slogan">نظام تسجيل الطلاب بالبطاقات الذكية</p>
                        <div class="datetime-section">
                            <div class="current-time">
                                <i class="bi bi-clock"></i>
                                <span id="timeDisplay">--:--:--</span>
                            </div>
                            <div class="current-date">
                                <i class="bi bi-calendar"></i>
                                <span id="dateDisplay">---</span>
                            </div>
                        </div>
                    </div>

                    <!-- Scan Area -->
                    <div class="scan-area">
                        <div class="text-center mb-4">
                            <div class="status-indicator status-ready" id="scannerStatus">
                                <i class="bi bi-check-circle"></i>
                                <span>جاهز لمسح البطاقة</span>
                            </div>
                        </div>

                        <div class="scan-input-wrapper">
                            <input type="text"
                                   class="scan-input"
                                   id="cardInput"
                                   placeholder="امسح البطاقة أو أدخل الرقم يدوياً"
                                   autocomplete="off"
                                   autofocus>
                            <i class="bi bi-upc-scan scan-icon" style="position: absolute; left: 20px; top: 50%; transform: translateY(-50%); font-size: 1.5rem; color: var(--primary-color);"></i>
                        </div>

                        <div class="action-buttons">
                            <button class="btn-action btn-primary-custom" onclick="focusScanner()">
                                <i class="bi bi-upc-scan"></i>
                                <span>تركيز الماسح</span>
                            </button>
                            <button class="btn-action btn-success-custom" onclick="manualEntry()">
                                <i class="bi bi-pencil-square"></i>
                                <span>إدخال يدوي</span>
                            </button>
                            <button class="btn-action btn-warning-custom" onclick="clearScanner()">
                                <i class="bi bi-arrow-clockwise"></i>
                                <span>إعادة تعيين</span>
                            </button>
                        </div>
                    </div>

                    <!-- Result Area -->
                    <div class="result-area p-4" id="resultArea">
                        <div id="scanResult"></div>
                    </div>

                    <!-- Footer -->
                    <div class="footer">
                        <p class="mb-0">
                            <i class="bi bi-c-circle"></i>
                            2026 Redox Academy - جميع الحقوق محفوظة
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/locale/ar.js"></script>

    <script>
        // ============================================================
        //  نظام تسجيل الطلاب بالبطاقات - نسخة احترافية (بدون سجل المسحات)
        // ============================================================

        let isScanning = false;
        let audioEnabled = true;
        let audioContext = null;
        let privacyTimer = null;
        let alertTimer = null;

        // ----- helpers -----
        function getSchoolName() {
            try {
                const raw = localStorage.getItem('school');
                if (!raw) return '';
                const parsed = JSON.parse(raw);
                return typeof parsed === 'string' ? parsed : (parsed?.name || '');
            } catch { return ''; }
        }

        // ----- audio -----
        function initAudio() {
            if (!audioContext && audioEnabled) {
                try { audioContext = new(window.AudioContext || window.webkitAudioContext)(); } catch (e) { console.warn('Web Audio not supported'); }
            }
            return audioContext;
        }

        function playBeep(freq, dur, vol = 0.15) {
            if (!audioEnabled) return;
            try {
                const ctx = initAudio();
                if (!ctx || ctx.state === 'closed') return;
                if (ctx.state === 'suspended') ctx.resume();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sine';
                osc.frequency.value = freq;
                gain.gain.value = vol;
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
                osc.stop(ctx.currentTime + dur);
            } catch (e) { /* ignore */ }
        }

        function playErrorSound() { playBeep(440, 0.3); setTimeout(() => playBeep(349, 0.3), 300); }
        function playWarningSound() { playBeep(880, 0.2, 0.2); setTimeout(() => playBeep(784, 0.2, 0.2), 200); setTimeout(() => playBeep(880, 0.2, 0.2), 400); setTimeout(() => playBeep(784, 0.2, 0.2), 600); setTimeout(() => playBeep(880, 0.3, 0.25), 800); }

            return `
                <div class="virtual-student-card animate__animated animate__fadeInUp" id="studentCard">

        // ----- process card -----
        async function processCard(cardUid) {
            if (isScanning) return;
            try {
                isScanning = true;
                const clean = cardUid.toString().trim();
                if (clean.length < 4) throw new Error('رقم البطاقة غير مكتمل');
                updateStatus('جاري التعرف على البطاقة...', 'status-scanning', 'bi-arrow-repeat');
                playScanSound();
                document.getElementById('scanResult').innerHTML = `<div class="text-center py-5"><div class="loading-spinner"></div><h5 class="mt-3">جاري المعالجة...</h5><p class="text-muted">يرجى الانتظار</p></div>`;

                const res = await fetch('/api/attendance/card-scan-enhanced', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cardUid: clean, sendSMS: false, checkPayments: true, checkRegistration: true })
                });
                const data = await res.json();

                if (data.success) {
                    const student = data.data?.student;
                    const classInfo = data.data?.class;
                    const attendance = data.data?.attendance;
                    const overduePayments = data.data?.overduePayments || [];
                    const registrationStatus = data.data?.registrationStatus;
                    const hasOverdue = data.data?.hasOverdue || overduePayments.length > 0;
                    const hasRegistrationIssue = data.data?.hasRegistrationIssue || false;
                    const hasIssues = data.data?.hasIssues || hasOverdue || hasRegistrationIssue;
                    const totalOverdueAmount = data.data?.totalOverdueAmount || 0;

                    if (student) {
                        displayStudentInfo(student, classInfo, attendance, overduePayments, registrationStatus, hasIssues);
                        if (hasOverdue) {
                            updateStatus(`⚠️ ${overduePayments.length} دفعة متأخرة (${totalOverdueAmount.toLocaleString()} د.ج)`, 'status-overdue', 'bi-exclamation-triangle');
                            playOverdueSound();
                        } else if (hasRegistrationIssue) {
                            updateStatus('⚠️ رسوم التسجيل غير مدفوعة', 'status-warning', 'bi-exclamation-circle');
                            playWarningSound();
                        } else {
                            updateStatus('✅ تم التسجيل بنجاح', 'status-success', 'bi-check-circle');
                            playSuccessSound();
                        }
                        showToast('success', `✅ تم تسجيل حضور الطالب ${student.name} بنجاح`);
                    } else {
                        showErrorResult('بيانات الطالب غير مكتملة');
                    }
                } else {
                    if (data.error && data.error.includes('بطاقة غير مسجلة')) handleUnknownCard(clean);
                    else handleFailedAttendance(data);
                }
            } catch (err) {
                console.error(err);
                handleUnknownCard(cardUid);
            } finally {
                isScanning = false;
                setTimeout(() => {
                    const cur = document.getElementById('scannerStatus');
                    if (!cur.classList.contains('status-overdue') && !cur.classList.contains('status-warning')) {
                        updateStatus('جاهز لمسح البطاقة', 'status-ready', 'bi-check-circle');
                    }
                }, 2000);
                document.getElementById('cardInput').value = '';
                document.getElementById('cardInput').focus();
            }
        }

            document.getElementById('scanResult').innerHTML = `
                <div class="virtual-student-card animate__animated animate__shake" style="background:linear-gradient(135deg,#e63946,#9d0208);">
                    <div class="text-center"><i class="bi bi-exclamation-triangle display-1"></i><h3 class="mt-3">بطاقة غير معروفة</h3><div class="card-number">${cardUid}</div><p class="mt-3">هذه البطاقة غير مسجلة في النظام</p><button class="btn btn-light mt-3" onclick="clearScanner()"><i class="bi bi-arrow-clockwise"></i> إعادة المحاولة</button></div>
                </div>
            `;
            updateStatus('بطاقة غير معروفة', 'status-error', 'bi-exclamation-triangle');
            playErrorSound();
        }

        function handleFailedAttendance(data) {
            showErrorResult(data.error || 'حدث خطأ أثناء التسجيل');
            playErrorSound();
            updateStatus('فشل التسجيل', 'status-error', 'bi-exclamation-triangle');

        function showErrorResult(msg) {
            document.getElementById('scanResult').innerHTML = `
                <div class="virtual-student-card animate__animated animate__shake" style="background:linear-gradient(135deg,#e63946,#9d0208);">
                    <div class="text-center"><i class="bi bi-x-circle display-1"></i><h3 class="mt-3">حدث خطأ</h3><p>${msg}</p><button class="btn btn-light mt-3" onclick="clearScanner()"><i class="bi bi-arrow-clockwise"></i> إعادة المحاولة</button></div>
                </div>
            `;
        }

        // ----- toast -----
        function showToast(type, msg) {
            const toast = document.createElement('div');
            const cls = type === 'success' ? 'alert-success' : type === 'warning' ? 'alert-warning' : type === 'error' ? 'alert-error' : 'alert-info';
            const icon = type === 'success' ? 'bi-check-circle-fill' : type === 'warning' ? 'bi-exclamation-triangle-fill' : type === 'error' ? 'bi-exclamation-triangle-fill' : 'bi-info-circle-fill';
            toast.className = `alert-message ${cls} animate__animated animate__fadeInDown`;
            toast.innerHTML = `<i class="bi ${icon}"></i><span>${msg}</span>`;
            document.body.appendChild(toast);
            setTimeout(() => { toast.classList.add('fade-out'); setTimeout(() => toast.remove(), 300); }, 4000);
        }

        // ----- helpers -----
        function getAcademicYearName(code) {
            const map = { '1AS':'الأولى ثانوي','2AS':'الثانية ثانوي','3AS':'الثالثة ثانوي','1MS':'الأولى متوسط','2MS':'الثانية متوسط','3MS':'الثالثة متوسط','4MS':'الرابعة متوسط','5MS':'الخامسة متوسط','1AP':'الأولى ابتدائي','2AP':'الثانية ابتدائي','3AP':'الثالثة ابتدائي','4AP':'الرابعة ابتدائي','5AP':'الخامسة ابتدائي','NS':'غير محدد' };
            return map[code] || code || 'غير محدد';
        }

        function focusScanner() { document.getElementById('cardInput').focus(); showToast('info', 'الماسح الضوئي جاهز'); }
        function manualEntry() { document.getElementById('cardInput').focus(); showToast('info', 'أدخل رقم البطاقة ثم اضغط Enter'); }

        function clearScanner() {
            if (privacyTimer) { clearTimeout(privacyTimer); privacyTimer = null; }
            if (alertTimer) { clearTimeout(alertTimer); alertTimer = null; }
            document.getElementById('cardInput').value = '';
            document.getElementById('scanResult').innerHTML = '';
            document.getElementById('cardInput').focus();
            updateStatus('جاهز لمسح البطاقة', 'status-ready', 'bi-check-circle');
            removePrivacyBlur();
        }

        // ----- setup scanner -----
        function setupScanner() {
            const input = document.getElementById('cardInput');
            let buffer = '', timeout = null;

            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const val = e.target.value.trim();
                    if (val.length >= 4) processCard(val);
                }
            });

            document.addEventListener('keydown', function(e) {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                if (e.key >= '0' && e.key <= '9') {
                    e.preventDefault();
                    buffer += e.key;
                    input.value = buffer;
                    if (timeout) clearTimeout(timeout);
                    timeout = setTimeout(() => {
                        if (buffer.length >= 4) processCard(buffer);
                        buffer = '';
                        input.value = '';
                        timeout = null;
                    }, 80);
                }
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    if (document.getElementById('paymentAlertOverlay')) dismissAlert();
                    clearScanner();
                }
            });
        }

        // ----- init -----
        function initApp() {
            console.log('🚀 نظام تسجيل الطلاب (نسخة احترافية)');
            const name = getSchoolName().trim();
            const el = document.getElementById('schoolName');
            if (name) { el.textContent = name; document.title = `${name} | Redox`; } else el.textContent = 'اسم المدرسة غير محدد';
            updateDateTime();
            setInterval(updateDateTime, 1000);
            setupScanner();
            setTimeout(playWelcomeSound, 500);
            console.log('✅ تم إزالة قسم "آخر عمليات المسح". التصميم احترافي ونظيف.');
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
