<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تسجيل الطلاب بالبطاقات الذكية - أكاديمية الرواد</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap');
        
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --success-color: #06d6a0;
            --warning-color: #ffb703;
            --danger-color: #e63946;
            --dark-color: #1e1e2f;
            --light-color: #f8f9fa;
            --gray-color: #6c757d;
            --card-bg: rgba(255, 255, 255, 0.95);
            --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-success: linear-gradient(135deg, #06d6a0 0%, #118ab2 100%);
            --gradient-warning: linear-gradient(135deg, #ffb703 0%, #fb8500 100%);
            --gradient-danger: linear-gradient(135deg, #e63946 0%, #9d0208 100%);
            --box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            --border-radius: 20px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--gradient-primary);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.1"><path fill="white" d="M50 0 L100 50 L50 100 L0 50 Z"/></svg>');
            background-size: 50px 50px;
            animation: moveBackground 20s linear infinite;
            pointer-events: none;
        }
        
        @keyframes moveBackground {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(50px, 50px) rotate(10deg); }
        }
        
        .container-fluid {
            position: relative;
            z-index: 10;
            max-width: 1400px;
            width: 100%;
        }
        
        .scan-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .scan-header {
            background: var(--gradient-primary);
            color: white;
            padding: 25px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .scan-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .school-logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid white;
            object-fit: cover;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .school-name {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .datetime-section {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 15px;
            margin-top: 15px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .current-time {
            font-size: 2.5rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 5px;
        }
        
        .scan-area {
            padding: 30px;
            background: rgba(255,255,255,0.5);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        
        .scan-input-wrapper {
            position: relative;
            max-width: 500px;
            margin: 0 auto;
        }
        
        .scan-input {
            width: 100%;
            padding: 20px 25px;
            font-size: 1.2rem;
            text-align: center;
            border: 3px solid #e9ecef;
            border-radius: 50px;
            background: white;
            transition: all 0.3s ease;
            font-family: 'Tajawal', sans-serif;
            letter-spacing: 2px;
        }
        
        .scan-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 5px rgba(67, 97, 238, 0.2);
            outline: none;
        }
        
        .virtual-student-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            padding: 20px;
            color: white;
            position: relative;
            overflow: hidden;
            margin: 20px 0;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
            animation: fadeInUp 0.5s ease-out;
        }
        
        .virtual-student-card:hover {
            transform: translateY(-5px);
        }
        
        .virtual-student-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: rotate 15s linear infinite;
        }
        
        /* 🔥 تأثير إخفاء اسم الطالب - تمويه الخصوصية */
        .privacy-blur {
            filter: blur(8px);
            transition: filter 0.8s ease;
            user-select: none;
        }
        
        .privacy-blur:hover {
            filter: blur(0px);
        }
        
        .card-chip {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 50px;
            height: 40px;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .card-chip i {
            font-size: 24px;
            color: #b8860b;
        }
        
        .student-avatar-large {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid white;
            object-fit: cover;
            margin: 0 auto 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.5s ease;
        }
        
        .student-avatar-large img {
            transition: filter 0.8s ease;
        }
        
        .student-avatar-large.blurred img {
            filter: blur(10px);
        }
        
        .student-avatar-large i {
            font-size: 50px;
            color: white;
        }
        
        .student-name-card {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 5px;
            text-align: center;
            transition: all 0.8s ease;
        }
        
        .student-name-card.blurred {
            filter: blur(8px);
            color: rgba(255,255,255,0.3);
        }
        
        .student-id-card {
            font-size: 0.9rem;
            opacity: 0.9;
            text-align: center;
            font-family: monospace;
            letter-spacing: 2px;
            transition: all 0.8s ease;
        }
        
        .student-id-card.blurred {
            filter: blur(6px);
            opacity: 0.4;
        }
        
        .card-number {
            font-size: 1.2rem;
            font-family: monospace;
            letter-spacing: 3px;
            margin: 15px 0;
            text-align: center;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 10px;
        }
        
        .card-expiry {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-size: 0.8rem;
            opacity: 0.8;
        }
        
        .status-indicator {
            display: inline-flex;
            align-items: center;
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.1rem;
            margin: 20px 0;
            background: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }
        
        .status-ready { color: var(--success-color); border: 2px solid var(--success-color); }
        .status-scanning { color: var(--warning-color); border: 2px solid var(--warning-color); animation: pulse 1.5s infinite; }
        .status-success { color: var(--success-color); border: 2px solid var(--success-color); background: rgba(6, 214, 160, 0.1); }
        .status-error { color: var(--danger-color); border: 2px solid var(--danger-color); background: rgba(230, 57, 70, 0.1); }
        .status-warning { color: var(--warning-color); border: 2px solid var(--warning-color); background: rgba(255, 183, 3, 0.1); animation: pulseWarning 1s infinite; }
        .status-overdue { color: var(--danger-color); border: 2px solid var(--danger-color); background: rgba(230, 57, 70, 0.15); animation: pulseOverdue 1s infinite; }
        .status-completed { color: var(--primary-color); border: 2px solid var(--primary-color); background: rgba(67, 97, 238, 0.1); }
        
        @keyframes pulseWarning { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
        @keyframes pulseOverdue { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.03); opacity: 0.9; } 100% { transform: scale(1); opacity: 1; } }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        
        .btn-action {
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
        }
        
        .btn-action:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .btn-primary-custom { background: var(--gradient-primary); color: white; }
        .btn-success-custom { background: var(--gradient-success); color: white; }
        .btn-warning-custom { background: var(--gradient-warning); color: white; }
        
        /* ============================================== */
        /* رسالة التحدير - Overlay Style محسنة */
        /* ============================================== */
        .alert-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeInOverlay 0.3s ease-out;
            backdrop-filter: blur(5px);
        }
        
        .alert-overlay.fade-out {
            animation: fadeOutOverlay 0.5s ease-out forwards;
        }
        
        @keyframes fadeInOverlay { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeOutOverlay { from { opacity: 1; } to { opacity: 0; } }
        
        .alert-box {
            background: white;
            border-radius: 30px;
            padding: 40px 50px;
            max-width: 600px;
            width: 95%;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
            animation: bounceIn 0.5s ease-out;
            border: 5px solid var(--danger-color);
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .alert-box.fade-out {
            animation: bounceOut 0.5s ease-out forwards;
        }
        
        @keyframes bounceOut {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); }
            100% { transform: scale(0.5); opacity: 0; }
        }
        
        .alert-box.registration-warning { border-color: var(--warning-color); }
        .alert-box.overdue-warning { border-color: var(--danger-color); }
        
        @keyframes bounceIn { 0% { transform: scale(0.5); opacity: 0; } 60% { transform: scale(1.05); } 100% { transform: scale(1); opacity: 1; } }
        
        .alert-box .alert-icon { font-size: 80px; margin-bottom: 20px; animation: shakeWarning 0.8s infinite; }
        .alert-box .alert-icon.danger { color: var(--danger-color); }
        .alert-box .alert-icon.warning { color: var(--warning-color); }
        
        @keyframes shakeWarning { 0% { transform: rotate(0deg); } 25% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } 100% { transform: rotate(0deg); } }
        
        .alert-box .alert-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 15px; }
        .alert-box .alert-title.danger { color: var(--danger-color); }
        .alert-box .alert-title.warning { color: var(--warning-color); }
        .alert-box .alert-message { font-size: 1.1rem; color: var(--dark-color); margin-bottom: 10px; line-height: 1.6; }
        
        .alert-box .alert-details {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 15px;
            margin: 15px 0;
            text-align: right;
        }
        
        .alert-box .alert-details .detail-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #eee;
            font-size: 0.95rem;
        }
        .alert-box .alert-details .detail-item:last-child { border-bottom: none; }
        .alert-box .alert-details .detail-label { color: var(--gray-color); font-weight: 500; }
        .alert-box .alert-details .detail-value { font-weight: 700; }
        .alert-box .alert-details .detail-value.danger { color: var(--danger-color); }
        .alert-box .alert-details .detail-value.warning { color: var(--warning-color); }
        
        /* 🔥 عداد العد التنازلي */
        .countdown-timer {
            display: inline-block;
            background: var(--primary-color);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-top: 10px;
            font-weight: 600;
        }
        
        .alert-box .btn-dismiss-alert {
            color: white;
            border: none;
            padding: 12px 40px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .alert-box .btn-dismiss-alert.danger { background: var(--gradient-danger); }
        .alert-box .btn-dismiss-alert.warning { background: var(--gradient-warning); }
        .alert-box .btn-dismiss-alert.success { background: var(--gradient-success); }
        .alert-box .btn-dismiss-alert:hover { transform: scale(1.05); box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .alert-box .btn-dismiss-alert:active { transform: scale(0.95); }
        
        /* ============================================== */
        /* قائمة المسحات الحديثة */
        /* ============================================== */
        .recent-scans {
            padding: 20px 30px;
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
        }
        
        .recent-scans-title {
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--dark-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .recent-scans-list {
            max-height: 150px;
            overflow-y: auto;
        }
        
        .recent-scan-item {
            padding: 8px 12px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s ease;
        }
        
        .recent-scan-item:hover {
            background: rgba(67, 97, 238, 0.05);
            border-radius: 8px;
        }
        
        .recent-scan-item .badge-overdue {
            background: var(--danger-color);
            color: white;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 20px;
            margin-left: 5px;
        }
        
        .recent-scan-item .badge-registration {
            background: var(--warning-color);
            color: white;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 20px;
            margin-left: 5px;
        }
        
        /* ============================================== */
        /* رسائل التنبيه الصغيرة (Toast) */
        /* ============================================== */
        .alert-message {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            min-width: 300px;
            max-width: 500px;
            padding: 15px 20px;
            border-radius: 10px;
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideDown 0.3s ease-out;
        }
        
        .alert-message.fade-out {
            animation: slideUp 0.3s ease-out forwards;
        }
        
        @keyframes slideDown { from { opacity: 0; transform: translate(-50%, -20px); } to { opacity: 1; transform: translate(-50%, 0); } }
        @keyframes slideUp { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, -20px); } }
        
        .alert-success { border-right: 5px solid var(--success-color); }
        .alert-error { border-right: 5px solid var(--danger-color); }
        .alert-warning { border-right: 5px solid var(--warning-color); }
        .alert-info { border-right: 5px solid var(--primary-color); }
        
        .loading-spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(67, 97, 238, 0.2);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .footer {
            padding: 15px 30px;
            background: var(--dark-color) !important;
            color: rgba(255,255,255,0.7) !important;
            text-align: center;
            font-size: 0.9rem;
        }
        
        /* ============================================== */
        /* تصميم متجاوب */
        /* ============================================== */
        @media (max-width: 768px) {
            .school-name { font-size: 1.4rem; }
            .current-time { font-size: 2rem; }
            .student-name-card { font-size: 1.2rem; }
            .alert-box { padding: 25px 20px; }
            .alert-box .alert-title { font-size: 1.4rem; }
            .alert-box .alert-icon { font-size: 60px; }
            .action-buttons .btn-action { padding: 10px 18px; font-size: 0.9rem; }
            .scan-input { font-size: 1rem; padding: 15px 20px; }
        }
        
        @media (max-width: 480px) {
            body { padding: 10px; }
            .scan-header { padding: 15px 20px; }
            .scan-area { padding: 20px; }
            .recent-scans { padding: 15px 20px; }
            .alert-box { padding: 20px 15px; max-width: 100%; margin: 10px; border-radius: 20px; }
            .alert-box .alert-title { font-size: 1.2rem; }
            .alert-box .alert-icon { font-size: 50px; }
        }
        
        .recent-scans-list::-webkit-scrollbar { width: 4px; }
        .recent-scans-list::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        .recent-scans-list::-webkit-scrollbar-thumb { background: var(--primary-color); border-radius: 10px; }
        .recent-scans-list::-webkit-scrollbar-thumb:hover { background: var(--secondary-color); }
        
        .info-item {
            background: #f8f9fa;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 8px;
        }
        .info-label { font-size: 0.8rem; color: #6c757d; margin-bottom: 2px; }
        .info-value { font-size: 1rem; font-weight: 500; }
        
        /* 🔥 مؤشر الحضور */
        .attendance-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .attendance-badge.present {
            background: #d1fae5;
            color: #065f46;
        }
        
        .attendance-badge.late {
            background: #fef3c7;
            color: #92400e;
        }
        
        .attendance-badge.absent {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="scan-card">
                    <!-- الهيدر -->
                    <div class="scan-header">
                        <div class="d-flex justify-content-center">
                            <div class="school-logo d-flex align-items-center justify-content-center bg-white">
                                <i class="bi bi-mortarboard display-4 text-primary"></i>
                            </div>
                        </div>
                        <h1 class="school-name">أكاديمية الرواد للتعليم والمعارف</h1>
                        <p class="school-slogan">نظام تسجيل الطلاب بالبطاقات الذكية</p>
                        
                        <div class="datetime-section">
                            <div class="current-time">
                                <i class="bi bi-clock"></i>
                                <span id="timeDisplay">--:--:--</span>
                            </div>
                            <div class="current-date">
                                <i class="bi bi-calendar"></i>
                                <span id="dateDisplay">---</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- منطقة المسح -->
                    <div class="scan-area">
                        <div class="text-center mb-4">
                            <div class="status-indicator status-ready" id="scannerStatus">
                                <i class="bi bi-check-circle"></i>
                                <span>جاهز لمسح البطاقة</span>
                            </div>
                        </div>
                        
                        <div class="scan-input-wrapper">
                            <input type="text" 
                                   class="scan-input" 
                                   id="cardInput" 
                                   placeholder="امسح البطاقة أو أدخل الرقم يدوياً"
                                   autocomplete="off"
                                   autofocus>
                            <i class="bi bi-upc-scan scan-icon" style="position: absolute; left: 20px; top: 50%; transform: translateY(-50%); font-size: 1.5rem; color: var(--primary-color);"></i>
                        </div>
                        
                        <div class="action-buttons">
                            <button class="btn-action btn-primary-custom" onclick="focusScanner()">
                                <i class="bi bi-upc-scan"></i>
                                <span>تركيز الماسح</span>
                            </button>
                            <button class="btn-action btn-success-custom" onclick="manualEntry()">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/locale/ar.js"></script>
    
    <script>
        // ==============================================
        // نظام تسجيل الطلاب بالبطاقات - الإصدار المحسن
        // مع دعم إخفاء البيانات للخصوصية وعد تنازلي
        // ==============================================
        
        let recentScans = [];
        let isScanning = false;
        let audioEnabled = true;
        let audioContext = null;
        let privacyTimer = null;
        let alertTimer = null;
        
        // ==============================================
        // نظام الصوت والإنذار
        // ==============================================
        
        function initAudio() {
            if (!audioContext && audioEnabled) {
                try {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                } catch(e) {
                    console.log('⚠️ Web Audio API غير مدعوم');
                }
            }
            return audioContext;
        }
        
        function playBeep(frequency, duration, volume = 0.15) {
            if (!audioEnabled) return;
            
            try {
                const ctx = initAudio();
                if (!ctx || ctx.state === 'closed') return;
                
                if (ctx.state === 'suspended') {
                    ctx.resume();
                }
                
                const oscillator = ctx.createOscillator();
                const gainNode = ctx.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(ctx.destination);
                
                oscillator.type = 'sine';
                oscillator.frequency.value = frequency;
                gainNode.gain.value = volume;
                
                oscillator.start();
                gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                oscillator.stop(ctx.currentTime + duration);
            } catch(e) {
                console.log('⚠️ خطأ في تشغيل الصوت:', e);
            }
        }
        
        function playScanSound() { playBeep(800, 0.2); }
        
        function playSuccessSound() {
            playBeep(1046.50, 0.15);
            setTimeout(() => playBeep(1318.52, 0.15), 150);
            setTimeout(() => playBeep(1567.98, 0.3), 300);
        }
        
        function playErrorSound() {
            playBeep(440, 0.3);
            setTimeout(() => playBeep(349.23, 0.3), 300);
        }
        
        function playWarningSound() {
            playBeep(880, 0.2, 0.2);
            setTimeout(() => playBeep(784, 0.2, 0.2), 200);
            setTimeout(() => playBeep(880, 0.2, 0.2), 400);
            setTimeout(() => playBeep(784, 0.2, 0.2), 600);
            setTimeout(() => playBeep(880, 0.3, 0.25), 800);
        }
        
        function playOverdueSound() {
            for (let i = 0; i < 3; i++) {
                setTimeout(() => playBeep(600, 0.3, 0.3), i * 400);
                setTimeout(() => playBeep(450, 0.3, 0.3), i * 400 + 200);
            }
        }
        
        function playWelcomeSound() {
            if (!audioEnabled) return;
            const notes = [523.25, 587.33, 659.25, 783.99];
            notes.forEach((freq, i) => {
                setTimeout(() => playBeep(freq, 0.2), i * 150);
            });
        }
        
        // 🔥 صوت انتهاء المسح
        function playCompletionSound() {
            if (!audioEnabled) return;
            // صوت مميز للإشارة إلى انتهاء عملية المسح
            playBeep(880, 0.15, 0.2);
            setTimeout(() => playBeep(1108, 0.15, 0.2), 150);
            setTimeout(() => playBeep(1318, 0.2, 0.25), 300);
        }
        
        document.addEventListener('click', function enableAudio() {
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }
            document.removeEventListener('click', enableAudio);
        }, { once: true });
        
        // ==============================================
        // تحديث الوقت
        // ==============================================
        
        function updateDateTime() {
            const now = new Date();
            document.getElementById('timeDisplay').textContent = now.toLocaleTimeString('ar-EG');
            document.getElementById('dateDisplay').textContent = now.toLocaleDateString('ar-EG', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }
        
        // ==============================================
        // تحديث الحالة
        // ==============================================
        
        function updateStatus(text, statusClass, icon) {
            const statusElement = document.getElementById('scannerStatus');
            statusElement.className = `status-indicator ${statusClass}`;
            statusElement.innerHTML = `<i class="bi ${icon}"></i><span>${text}</span>`;
        }
        
        // ==============================================
        // 🔥 إخفاء معلومات الطالب للخصوصية
        // ==============================================
        
        function applyPrivacyBlur() {
            // تطبيق التمويه على اسم الطالب وصورته
            const nameElement = document.querySelector('.student-name-card');
            const idElement = document.querySelector('.student-id-card');
            const avatarElement = document.querySelector('.student-avatar-large');
            
            if (nameElement) nameElement.classList.add('blurred');
            if (idElement) idElement.classList.add('blurred');
            if (avatarElement) avatarElement.classList.add('blurred');
            
            // إضافة تأثير التمويه على باقي المعلومات
            const infoValues = document.querySelectorAll('.info-value');
            infoValues.forEach(el => {
                if (!el.closest('.payment-status') && !el.closest('.status-badge')) {
                    el.classList.add('privacy-blur');
                }
            });
        }
        
        function removePrivacyBlur() {
            const nameElement = document.querySelector('.student-name-card');
            const idElement = document.querySelector('.student-id-card');
            const avatarElement = document.querySelector('.student-avatar-large');
            
            if (nameElement) nameElement.classList.remove('blurred');
            if (idElement) idElement.classList.remove('blurred');
            if (avatarElement) avatarElement.classList.remove('blurred');
            
            const infoValues = document.querySelectorAll('.info-value');
            infoValues.forEach(el => {
                el.classList.remove('privacy-blur');
            });
        }
        
        function startPrivacyTimer() {
            // إلغاء المؤقت السابق إذا وجد
            if (privacyTimer) {
                clearTimeout(privacyTimer);
                privacyTimer = null;
            }
            
            // 🔥 بدء المؤقت الجديد - 15 ثانية
            privacyTimer = setTimeout(() => {
                applyPrivacyBlur();
                // تشغيل صوت انتهاء المسح
                playCompletionSound();
                updateStatus('تم إخفاء البيانات للخصوصية', 'status-completed', 'bi-shield-check');
                privacyTimer = null;
            }, 15000); // 15 ثانية
        }
        
        // ==============================================
        // 🔥 إخفاء رسالة التحدير تلقائياً بعد 10 ثواني
        // ==============================================
        
        function startAlertAutoDismiss() {
            // إلغاء المؤقت السابق
            if (alertTimer) {
                clearTimeout(alertTimer);
                alertTimer = null;
            }
            
            // إضافة عداد العد التنازلي
            const alertBox = document.querySelector('.alert-box');
            if (alertBox) {
                // إزالة العداد القديم
                const oldCounter = alertBox.querySelector('.countdown-timer');
                if (oldCounter) oldCounter.remove();
                
                // إضافة عداد جديد
                const counter = document.createElement('div');
                counter.className = 'countdown-timer';
                counter.id = 'countdownTimer';
                counter.textContent = '⏱️ سيختفي خلال 10 ثواني';
                alertBox.appendChild(counter);
                
                // تحديث العداد كل ثانية
                let seconds = 10;
                const interval = setInterval(() => {
                    seconds--;
                    if (counter) {
                        counter.textContent = `⏱️ سيختفي خلال ${seconds} ثواني`;
                    }
                    if (seconds <= 0) {
                        clearInterval(interval);
                    }
                }, 1000);
            }
            
            // 🔥 إخفاء التحدير بعد 10 ثواني
            alertTimer = setTimeout(() => {
                dismissAlert();
                alertTimer = null;
            }, 10000); // 10 ثواني
        }
        
        // ==============================================
        // عرض رسائل التحدير للدفعات المتأخرة ورسوم التسجيل
        // ==============================================
        
        function showPaymentAlert(student, overduePayments = [], hasRegistrationFee = false) {
            // إلغاء المؤقت السابق
            if (alertTimer) {
                clearTimeout(alertTimer);
                alertTimer = null;
            }
            
            const payments = Array.isArray(overduePayments) ? overduePayments : [];
            const totalOverdue = payments.reduce((sum, p) => sum + (p.amount || 0), 0);
            const monthsCount = payments.length;
            
            if (payments.length > 0) {
                playOverdueSound();
            } else if (hasRegistrationFee) {
                playWarningSound();
            }
            
            const overlay = document.createElement('div');
            overlay.className = 'alert-overlay';
            overlay.id = 'paymentAlertOverlay';
            
            let paymentsList = '';
            if (payments.length > 0) {
                payments.slice(0, 10).forEach((p) => {
                    const className = p.class?.name || 'غير محدد';
                    const monthDisplay = p.month || p.monthCode || 'شهر غير محدد';
                    paymentsList += `
                        <div class="detail-item">
                            <span class="detail-label">${monthDisplay}</span>
                            <span class="detail-value danger">${(p.amount || 0).toLocaleString()} د.ج - ${className}</span>
                        </div>
                    `;
                });
                
                if (payments.length > 10) {
                    paymentsList += `
                        <div class="detail-item">
                            <span class="detail-label">و ${payments.length - 10} دفعات أخرى</span>
                            <span class="detail-value danger">...</span>
                        </div>
                    `;
                }
            }
            
            let registrationHtml = '';
            if (hasRegistrationFee) {
                registrationHtml = `
                    <div class="alert alert-warning mt-2" style="border-radius: 10px;">
                        <i class="bi bi-exclamation-triangle-fill text-warning me-2"></i>
                        <strong>⚠️ رسوم التسجيل غير مدفوعة</strong>
                        <br><small>المبلغ: 600 د.ج</small>
                    </div>
                `;
            }
            
            const isOverdue = payments.length > 0;
            const alertType = isOverdue ? 'danger' : 'warning';
            const alertIcon = isOverdue ? 'bi-exclamation-triangle-fill' : 'bi-exclamation-circle-fill';
            const titleText = isOverdue ? '⚠️ تنبيه: دفعات متأخرة' : '⚠️ تنبيه: رسوم التسجيل غير مدفوعة';
            
            overlay.innerHTML = `
                <div class="alert-box ${isOverdue ? 'overdue-warning' : 'registration-warning'}">
                    <div class="alert-icon ${alertType}">
                        <i class="bi ${alertIcon}"></i>
                    </div>
                    <div class="alert-title ${alertType}">${titleText}</div>
                    <div class="alert-message">
                        عزيزي ولي أمر الطالب <strong>${student.name}</strong>،
                        ${isOverdue ? `
                            <br>هناك <strong>${monthsCount}</strong> دفعة (شهر) متأخرة
                            <br>بإجمالي مبلغ <strong>${totalOverdue.toLocaleString()} د.ج</strong>
                        ` : `
                            <br>رسوم التسجيل غير مدفوعة
                            <br>المبلغ المطلوب: <strong>600 د.ج</strong>
                        `}
                    </div>
                    <div class="alert-details">
                        <div class="detail-item">
                            <span class="detail-label">الطالب</span>
                            <span class="detail-value">${student.name} (${student.studentId || 'غير محدد'})</span>
                        </div>
                        ${isOverdue ? `
                            <div class="detail-item">
                                <span class="detail-label">عدد الدفعات المتأخرة</span>
                                <span class="detail-value danger">${monthsCount} شهر</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">المبلغ الإجمالي</span>
                                <span class="detail-value danger">${totalOverdue.toLocaleString()} د.ج</span>
                            </div>
                            ${paymentsList}
                        ` : `
                            <div class="detail-item">
                                <span class="detail-label">رسوم التسجيل</span>
                                <span class="detail-value warning">600 د.ج (غير مدفوعة)</span>
                            </div>
                        `}
                        ${registrationHtml}
                    </div>
                    <div class="alert-message" style="color: ${isOverdue ? 'var(--danger-color)' : 'var(--warning-color)'}; font-weight: 600;">
                        <i class="bi bi-info-circle"></i>
                        ${isOverdue ? 'يرجى التوجه إلى الإدارة لتسوية الدفعات المتأخرة' : 'يرجى التوجه إلى الإدارة لدفع رسوم التسجيل'}
                    </div>
                    <button class="btn-dismiss-alert ${isOverdue ? 'danger' : 'warning'}" onclick="dismissAlert()">
                        <i class="bi bi-check2-circle"></i> تم التوجيه للإدارة
                    </button>
                </div>
            `;
            
            document.body.appendChild(overlay);
            document.body.style.overflow = 'hidden';
            
            // 🔥 بدء العد التنازلي لإخفاء التحدير تلقائياً
            startAlertAutoDismiss();
        }
        
        function dismissAlert() {
            const overlay = document.getElementById('paymentAlertOverlay');
            if (overlay) {
                // إضافة تأثير الإخفاء
                overlay.classList.add('fade-out');
                const alertBox = overlay.querySelector('.alert-box');
                if (alertBox) {
                    alertBox.classList.add('fade-out');
                }
                
                setTimeout(() => {
                    overlay.remove();
                    document.body.style.overflow = '';
                    document.getElementById('cardInput').focus();
                }, 500);
            }
            
            // إلغاء المؤقتات
            if (alertTimer) {
                clearTimeout(alertTimer);
                alertTimer = null;
            }
        }
        
        // ==============================================
        // عرض معلومات الطالب مع التحقق من الدفعات
        // ==============================================

            const hasOverdue = overduePayments && Array.isArray(overduePayments) && overduePayments.length > 0;
            const hasRegistrationFee = registrationStatus === 'pending' || registrationStatus === false;
            const hasWarning = hasOverdue || hasRegistrationFee;
            
            console.log(`📊 displayStudentInfo: hasOverdue=${hasOverdue}, hasRegistrationFee=${hasRegistrationFee}, hasWarning=${hasWarning}`);
            
            const totalOverdue = hasOverdue ? overduePayments.reduce((sum, p) => sum + (p.amount || 0), 0) : 0;
            const monthsCount = hasOverdue ? overduePayments.length : 0;

                        paymentsDetails += `

                const iconClass = hasOverdue ? 'bi-exclamation-triangle-fill' : 'bi-exclamation-circle-fill';
                const titleClass = hasOverdue ? 'text-danger' : 'text-warning';

                warningHtml = `
                    <div class="alert ${alertClass} animate__animated animate__pulse animate__infinite" style="border-radius: 15px; margin-top: 15px; border-right: 5px solid ${borderColor};">

                                </small>
                                <div class="mt-2" style="font-size: 0.85rem;">
                                    ${warningItems.join('')}

            let classHtml = '';

                        <div class="info-value fw-bold">${classInfo.name || 'غير محدد'}</div>
                        <div class="info-label text-muted mt-2">المادة</div>

                    </div>
                `;

            const paymentStatusText = hasOverdue ? '⚠️ متأخرة' : '✅ مسددة';
            const paymentStatusClass = hasOverdue ? 'text-danger' : 'text-success';
            const registrationStatusText = hasRegistrationFee ? '⚠️ غير مدفوعة' : '✅ مدفوعة';
            const registrationStatusClass = hasRegistrationFee ? 'text-warning' : 'text-success';
            
            resultDiv.innerHTML = `
                <div class="animate__animated animate__fadeIn">
                    ${displayVirtualStudentCard(student)}
                    
                    ${warningHtml}
                    
                    <div class="row mt-3 g-3">
                        <div class="col-md-6">
                            <div class="bg-${statusClass} bg-opacity-10 p-3 rounded text-center">
                                <i class="bi ${status === 'present' ? 'bi-check-circle-fill' : status === 'late' ? 'bi-exclamation-triangle-fill' : 'bi-x-circle-fill'} display-6 text-${statusClass}"></i>
                                <h5 class="mt-2 text-${statusClass}">${statusText}</h5>
                                ${attendance?.time ? `<small class="text-muted">${new Date(attendance.time).toLocaleTimeString('ar-EG')}</small>` : ''}
                            </div>
                        </div>
                        <div class="col-md-6">
                            ${classHtml || '<div class="bg-info bg-opacity-10 p-3 rounded text-center"><i class="bi bi-info-circle display-6"></i><h5 class="mt-2">لا توجد حصص حالياً</h5></div>'}
                        </div>
                    </div>
                    
                    <div class="row mt-3">
                        <div class="col-12">

                                </div>
                                <div class="row mt-2">

                                        <small class="text-muted">السنة الدراسية</small>
                                        <div class="info-value">${getAcademicYearName(student.academicYear)}</div>
                                    </div>
                                </div>
                                
                                <div class="row mt-2">
                                    <div class="col-6">
                                        <small class="text-muted">حالة الدفعات</small>
                                        <div class="${paymentStatusClass} fw-bold">
                                            ${paymentStatusText}
                                            ${hasOverdue ? ` (${monthsCount} دفعة)` : ''}
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <small class="text-muted">رسوم التسجيل</small>
                                        <div class="${registrationStatusClass} fw-bold">
                                            ${registrationStatusText}
                                        </div>
                                    </div>
                                </div>
                                
                                ${hasOverdue ? `
                                    <div class="row mt-2">
                                        <div class="col-12">
                                            <div class="alert alert-danger p-2" style="font-size: 0.85rem;">
                                                <i class="bi bi-exclamation-triangle-fill"></i>
                                                إجمالي المبلغ المتأخر: <strong>${totalOverdue.toLocaleString()} د.ج</strong>
                                            </div>
                                        </div>
                                    </div>
                                ` : ''}
                                
                                ${hasWarning ? `
                                    <div class="row mt-2">
                                        <div class="col-12">
                                            <button class="btn ${hasOverdue ? 'btn-danger' : 'btn-warning'} btn-sm w-100" onclick="showPaymentAlert(student, overduePayments, ${hasRegistrationFee})">
                                                <i class="bi bi-eye"></i> عرض تفاصيل المستحقات
                                            </button>
                                        </div>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            // 🔥 بدء مؤقت الخصوصية (15 ثانية)
            startPrivacyTimer();
            
            if (hasWarning) {
                setTimeout(() => {
                    showPaymentAlert(student, overduePayments || [], hasRegistrationFee);
                }, 800);
            }
        }
        
        // ==============================================
        // عرض بطاقة الطالب الافتراضية
        // ==============================================
        
        function displayVirtualStudentCard(student, cardUid = null) {
            const avatarUrl = student.avatarUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(student.name)}&background=4361ee&color=fff&size=100&bold=true&length=2`;
            
            const expiryDate = new Date();
            expiryDate.setFullYear(expiryDate.getFullYear() + 2);
            const expiryStr = `${expiryDate.getMonth()+1}/${expiryDate.getFullYear().toString().slice(-2)}`;
            
            const cardNumber = cardUid || student.cardUid || '**** **** **** ' + (student.studentId?.slice(-4) || '0000');
            const formattedCardNumber = cardNumber.match(/.{1,4}/g)?.join(' ') || cardNumber;
            
            return `
                <div class="virtual-student-card animate__animated animate__fadeInUp" id="studentCard">
                    <div class="card-chip">
                        <i class="bi bi-wifi"></i>
                    </div>
                    <div class="text-center">
                        <div class="student-avatar-large mx-auto" id="studentAvatar">
                            <img src="${avatarUrl}" alt="${student.name}" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(student.name)}&background=4361ee&color=fff&size=100&bold=true'">
                        </div>
                        <h3 class="student-name-card mt-3" id="studentName">${student.name}</h3>
                        <div class="student-id-card" id="studentId">رقم الطالب: ${student.studentId || 'غير محدد'}</div>
                        <div class="card-number">
                            <i class="bi bi-credit-card"></i> ${formattedCardNumber}
                        </div>
                        <div class="card-expiry">
                            <span><i class="bi bi-calendar"></i> صالحة حتى: ${expiryStr}</span>
                            <span><i class="bi bi-shield-check"></i> بطاقة ذكية</span>
                        </div>
                    </div>
                </div>
            `;
        }
        
        // ==============================================
        // معالجة البطاقة - النسخة المحسنة
        // ==============================================
        
        async function processCard(cardUid) {
            if (isScanning) {
                console.log('⏳ جاري معالجة بطاقة أخرى...');
                return;
            }
            
            try {
                isScanning = true;
                const cleanUid = cardUid.toString().trim();
                
                console.log('🔍 معالجة البطاقة:', cleanUid);
                
                if (cleanUid.length < 4) {
                    throw new Error('رقم البطاقة غير مكتمل');
                }
                
                updateStatus('جاري التعرف على البطاقة...', 'status-scanning', 'bi-arrow-repeat');
                playScanSound();
                
                document.getElementById('scanResult').innerHTML = `
                    <div class="text-center py-5">
                        <div class="loading-spinner"></div>
                        <h5 class="mt-3">جاري المعالجة...</h5>
                        <p class="text-muted">يرجى الانتظار</p>
                    </div>
                `;
                
                const response = await fetch('/api/attendance/card-scan-enhanced', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        cardUid: cleanUid, 
                        sendSMS: false,
                        checkPayments: true,
                        checkRegistration: true
                    })
                });
                
                const data = await response.json();
                
                console.log('📥 البيانات المستلمة:', data);
                
                if (data.success) {
                    const student = data.data?.student;
                    const classInfo = data.data?.class;
                    const attendance = data.data?.attendance;
                    const overduePayments = data.data?.overduePayments || [];
                    const registrationStatus = data.data?.registrationStatus;
                    const hasOverdue = data.data?.hasOverdue || (overduePayments.length > 0);
                    const hasRegistrationIssue = data.data?.hasRegistrationIssue || false;
                    const hasIssues = data.data?.hasIssues || (hasOverdue || hasRegistrationIssue);
                    const totalOverdueAmount = data.data?.totalOverdueAmount || 0;
                    
                    console.log(`📊 النتائج: hasOverdue=${hasOverdue}, hasRegistrationIssue=${hasRegistrationIssue}, hasIssues=${hasIssues}`);
                    console.log(`📊 عدد الدفعات المتأخرة: ${overduePayments.length}`);
                    console.log(`📊 إجمالي المبلغ المتأخر: ${totalOverdueAmount}`);
                    
                    if (student) {
                        // عرض معلومات الطالب مع التحذيرات
                        displayStudentInfo(student, classInfo, attendance, overduePayments, registrationStatus, hasIssues);
                        
                        // تحديث الحالة
                        if (hasOverdue) {
                            updateStatus(`⚠️ ${overduePayments.length} دفعة متأخرة (${totalOverdueAmount.toLocaleString()} د.ج)`, 'status-overdue', 'bi-exclamation-triangle');
                            playOverdueSound();
                        } else if (hasRegistrationIssue) {
                            updateStatus('⚠️ رسوم التسجيل غير مدفوعة', 'status-warning', 'bi-exclamation-circle');
                            playWarningSound();
                        } else {
                            updateStatus('✅ تم التسجيل بنجاح', 'status-success', 'bi-check-circle');
                            playSuccessSound();
                        }
                        
                        addToRecentScans({
                            type: hasIssues ? 'warning' : 'success',
                            student: { name: student.name, studentId: student.studentId },
                            timestamp: new Date(),
                            overdueCount: overduePayments.length,
                            hasRegistrationFee: hasRegistrationIssue,
                            totalOverdueAmount: totalOverdueAmount
                        });
                        
                        if (hasOverdue) {
                            showToast('error', `⚠️ الطالب ${student.name} لديه ${overduePayments.length} دفعة متأخرة (${totalOverdueAmount.toLocaleString()} د.ج)`);
                        } else if (hasRegistrationIssue) {
                            showToast('warning', `⚠️ الطالب ${student.name} لم يدفع رسوم التسجيل (600 د.ج)`);
                        } else {
                            showToast('success', `✅ تم تسجيل حضور الطالب ${student.name} بنجاح`);
                        }
                    } else {
                        showErrorResult('بيانات الطالب غير مكتملة');
                    }
                } else {
                    if (data.error && data.error.includes('بطاقة غير مسجلة')) {
                        handleUnknownCard(cleanUid);
                    } else {
                        handleFailedAttendance(data);
                    }
                }
                
            } catch (error) {
                console.error('❌ خطأ:', error);
                handleUnknownCard(cardUid);
            } finally {
                isScanning = false;
                setTimeout(() => {
                    const currentStatus = document.getElementById('scannerStatus');
                    if (!currentStatus.classList.contains('status-overdue') && 
                        !currentStatus.classList.contains('status-warning')) {
                        updateStatus('جاهز لمسح البطاقة', 'status-ready', 'bi-check-circle');
                    }
                }, 2000);
                
                document.getElementById('cardInput').value = '';
                document.getElementById('cardInput').focus();
            }
        }
        
        // ==============================================
        // عرض رسائل الخطأ والتويت
        // ==============================================
        
        function handleUnknownCard(cardUid) {
            const resultDiv = document.getElementById('scanResult');
            resultDiv.innerHTML = `
                <div class="virtual-student-card animate__animated animate__shake" style="background: linear-gradient(135deg, #e63946, #9d0208);">
                    <div class="text-center">
                        <i class="bi bi-exclamation-triangle display-1"></i>
                        <h3 class="mt-3">بطاقة غير معروفة</h3>
                        <div class="card-number">${cardUid}</div>
                        <p class="mt-3">هذه البطاقة غير مسجلة في النظام</p>
                        <button class="btn btn-light mt-3" onclick="clearScanner()">
                            <i class="bi bi-arrow-clockwise"></i> إعادة المحاولة
                        </button>
                    </div>
                </div>
            `;
            updateStatus('بطاقة غير معروفة', 'status-error', 'bi-exclamation-triangle');
            playErrorSound();
        }
        
        function handleFailedAttendance(data) {
            console.log('⚠️ فشل تسجيل الحضور:', data);
            showErrorResult(data.error || 'حدث خطأ أثناء التسجيل');
            playErrorSound();
            updateStatus('فشل التسجيل', 'status-error', 'bi-exclamation-triangle');
        }
        
        function showErrorResult(message) {
            const resultDiv = document.getElementById('scanResult');
            resultDiv.innerHTML = `
                <div class="virtual-student-card animate__animated animate__shake" style="background: linear-gradient(135deg, #e63946, #9d0208);">
                    <div class="text-center">
                        <i class="bi bi-x-circle display-1"></i>
                        <h3 class="mt-3">حدث خطأ</h3>
                        <p>${message}</p>
                        <button class="btn btn-light mt-3" onclick="clearScanner()">
                            <i class="bi bi-arrow-clockwise"></i> إعادة المحاولة
                        </button>
                    </div>
                </div>
            `;
        }
        
        function showToast(type, message) {
            const toast = document.createElement('div');
            const typeClass = type === 'success' ? 'alert-success' : type === 'warning' ? 'alert-warning' : type === 'error' ? 'alert-error' : 'alert-info';
            const icon = type === 'success' ? 'bi-check-circle-fill' : type === 'warning' ? 'bi-exclamation-triangle-fill' : type === 'error' ? 'bi-exclamation-triangle-fill' : 'bi-info-circle-fill';
            
            toast.className = `alert-message ${typeClass} animate__animated animate__fadeInDown`;
            toast.innerHTML = `<i class="bi ${icon}"></i><span>${message}</span>`;
            document.body.appendChild(toast);
            
            // 🔥 إخفاء الرسالة تلقائياً بعد 4 ثواني
            setTimeout(() => {
                toast.classList.add('fade-out');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }
        
        // ==============================================
        // إضافة للمسحات الحديثة
        // ==============================================
        
        function addToRecentScans(scan) {
            recentScans.unshift({
                ...scan,
                timestamp: scan.timestamp || new Date()
            });
            
            if (recentScans.length > 10) recentScans.pop();
            localStorage.setItem('studentCardRecentScans', JSON.stringify(recentScans));
            updateRecentScansList();
        }
        
        function updateRecentScansList() {
            const listElement = document.getElementById('recentScansList');
            
            if (recentScans.length === 0) {
                listElement.innerHTML = '<div class="recent-scan-item text-muted"><span>لا توجد عمليات مسح حديثة</span></div>';
                return;
            }
            
            listElement.innerHTML = recentScans.map(scan => {
                const timeString = new Date(scan.timestamp).toLocaleTimeString('ar-EG');
                const statusClass = scan.type === 'success' ? 'text-success' : scan.type === 'warning' ? 'text-warning' : 'text-danger';
                const statusIcon = scan.type === 'success' ? 'bi-check-circle-fill' : scan.type === 'warning' ? 'bi-exclamation-triangle-fill' : 'bi-x-circle-fill';
                
                let badges = '';
                if (scan.overdueCount > 0) {
                    badges += `<span class="badge-overdue">${scan.overdueCount} دفعة</span>`;
                }
                if (scan.hasRegistrationFee) {
                    badges += `<span class="badge-registration">رسوم تسجيل</span>`;
                }
                
                return `
                    <div class="recent-scan-item animate__animated animate__fadeIn">
                        <div>
                            <i class="bi ${statusIcon} ${statusClass}"></i>
                            <strong>${scan.student?.name || 'طالب'}</strong>
                            ${badges}
                            ${scan.student?.studentId ? `<br><small class="text-muted">${scan.student.studentId}</small>` : ''}
                        </div>
                        <div class="text-end">
                            <small class="scan-time text-muted">${timeString}</small>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function loadRecentScans() {
            const saved = localStorage.getItem('studentCardRecentScans');
            if (saved) {
                try {
                    recentScans = JSON.parse(saved);
                    updateRecentScansList();
                } catch(e) {}
            }
        }
        
        // ==============================================
        // وظائف مساعدة
        // ==============================================
        
        function getAcademicYearName(code) {
            const years = {
                '1AS': 'الأولى ثانوي', '2AS': 'الثانية ثانوي', '3AS': 'الثالثة ثانوي',
                '1MS': 'الأولى متوسط', '2MS': 'الثانية متوسط', '3MS': 'الثالثة متوسط', '4MS': 'الرابعة متوسط', '5MS': 'الخامسة متوسط',
                '1AP': 'الأولى ابتدائي', '2AP': 'الثانية ابتدائي', '3AP': 'الثالثة ابتدائي', '4AP': 'الرابعة ابتدائي', '5AP': 'الخامسة ابتدائي',
                'NS': 'غير محدد'
            };
            return years[code] || code || 'غير محدد';
        }
        
        function focusScanner() {
            document.getElementById('cardInput').focus();
            showToast('info', 'الماسح الضوئي جاهز');
        }
        
        function clearScanner() {
            // إلغاء مؤقت الخصوصية
            if (privacyTimer) {
                clearTimeout(privacyTimer);
                privacyTimer = null;
            }
            // إلغاء مؤقت التحدير
            if (alertTimer) {
                clearTimeout(alertTimer);
                alertTimer = null;
            }
            
            document.getElementById('cardInput').value = '';
            document.getElementById('scanResult').innerHTML = '';
            document.getElementById('cardInput').focus();
            updateStatus('جاهز لمسح البطاقة', 'status-ready', 'bi-check-circle');
            
            // إزالة التمويه إذا كان موجوداً
            removePrivacyBlur();
        }
        
        function manualEntry() {
            document.getElementById('cardInput').focus();
            showToast('info', 'أدخل رقم البطاقة ثم اضغط Enter');
        }
        
        // ==============================================
        // تهيئة الماسح
        // ==============================================
        
        function setupScanner() {
            const cardInput = document.getElementById('cardInput');
            let scanBuffer = '';
            let scanTimeout = null;
            
            cardInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const value = e.target.value.trim();
                    if (value.length >= 4) {
                        processCard(value);
                    }
                }
            });
            
            document.addEventListener('keydown', function(e) {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                
                if (e.key >= '0' && e.key <= '9') {
                    e.preventDefault();
                    scanBuffer += e.key;
                    cardInput.value = scanBuffer;
                    
                    if (scanTimeout) clearTimeout(scanTimeout);
                    scanTimeout = setTimeout(() => {
                        if (scanBuffer.length >= 4) {
                            processCard(scanBuffer);
                        }
                        scanBuffer = '';
                        cardInput.value = '';
                        scanTimeout = null;
                    }, 80);
                }
            });
            
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    if (document.getElementById('paymentAlertOverlay')) {
                        dismissAlert();
                    }
                    clearScanner();
                }
            });
        }
        
        // ==============================================
        // تهيئة التطبيق
        // ==============================================
        
        function initApp() {
            console.log('🚀 تهيئة نظام تسجيل الطلاب (النسخة المحسنة)...');
            updateDateTime();
            setInterval(updateDateTime, 1000);
            setupScanner();
            loadRecentScans();
            setTimeout(() => playWelcomeSound(), 500);
            console.log('✅ النظام جاهز. سيتم إخفاء بيانات الطالب بعد 15 ثانية للخصوصية.');
            console.log('✅ سيتم إخفاء رسائل التنبيه تلقائياً بعد 10 ثواني.');
        }
        
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
