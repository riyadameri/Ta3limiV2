<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>بوابة المدخل | Redox</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap');
:root{--bg:#eef2f8;--panel:#fff;--line:#dfe5ef;--tx:#0f1b33;--mut:#64748b;--navy:#0b2250;--navy2:#143a82;
--ok:#0e9f6e;--blue:#1f5eff;--warn:#f59e0b;--bad:#e11d48;--ac:var(--blue);--r:20px;--sh:0 10px 30px rgba(15,27,51,.08)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--tx);overflow-x:hidden;-webkit-font-smoothing:antialiased}
body[data-state=ready]{--ac:var(--blue)}body[data-state=scanning]{--ac:#6366f1}
body[data-state=success]{--ac:var(--ok)}body[data-state=late]{--ac:var(--warn)}body[data-state=error]{--ac:var(--bad)}
.app{min-height:100vh;min-height:100dvh;width:100%;display:flex;flex-direction:column}
/* header */
header{display:flex;align-items:center;gap:clamp(10px,1.6vw,22px);padding:clamp(10px,1.2vw,18px) clamp(14px,2.4vw,40px);color:#fff;
background:linear-gradient(110deg,var(--navy),var(--navy2));border-bottom:4px solid var(--ac);transition:border-color .5s;animation:down .7s cubic-bezier(.2,.8,.2,1) both;box-shadow:0 6px 24px rgba(11,34,80,.25)}
@keyframes down{from{opacity:0;transform:translateY(-100%)}}
.logo{height:clamp(30px,3.4vw,46px);max-width:140px;object-fit:contain;background:#fff;border-radius:10px;padding:4px 8px}
.logo-fb{display:none;width:42px;height:42px;border-radius:12px;background:#fff;color:var(--navy);place-items:center;font-size:1.2rem}
.sch{flex:1;min-width:0;display:flex;align-items:center;gap:clamp(10px,1.4vw,18px)}
#schoolLogoBox{width:clamp(44px,4.6vw,64px);height:clamp(44px,4.6vw,64px);border-radius:16px;background:#fff;display:grid;place-items:center;overflow:hidden;flex-shrink:0;color:var(--navy);font-size:1.5rem}
#schoolLogoBox img{width:100%;height:100%;object-fit:cover}
#schoolLogoBox.loading::after{content:'';width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
.sch h1{font-size:clamp(1.05rem,2.4vw,2rem);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sch p{font-size:clamp(.7rem,1vw,.9rem);opacity:.75}
.clock{text-align:left;direction:ltr;flex-shrink:0}
#timeDisplay{display:block;font-size:clamp(1.3rem,3vw,2.6rem);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
#dateDisplay{font-size:clamp(.68rem,1vw,.88rem);opacity:.75}
.fs{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;border:0;background:#fff;color:var(--navy);font:800 .9rem 'Tajawal';cursor:pointer;flex-shrink:0;transition:.25s}
.fs:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.25)}
.fs i{font-size:1.15rem}
/* main fills whole screen */
main{flex:1;display:grid;grid-template-columns:minmax(320px,.85fr) 1.15fr;gap:clamp(12px,1.8vw,28px);padding:clamp(12px,1.8vw,28px) clamp(14px,2.4vw,40px);min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.stage{padding:clamp(18px,3vw,44px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(16px,2.6vw,34px);animation:up .8s .1s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(30px)}}
.status{display:inline-flex;align-items:center;gap:8px;padding:9px 22px;border-radius:99px;font-weight:800;font-size:clamp(.82rem,1.2vw,1rem);background:color-mix(in srgb,var(--ac) 11%,#fff);border:1.5px solid var(--ac);color:var(--ac);transition:.4s}
.ring{position:relative;width:clamp(160px,24vw,300px);aspect-ratio:1;display:grid;place-items:center}
.ring i.ic{font-size:clamp(3.2rem,7.5vw,6rem);color:var(--ac);transition:.4s;z-index:2}
.ring span{position:absolute;inset:0;border-radius:50%;border:2px solid var(--ac);opacity:0}
body[data-state=ready] .ring span{animation:ping 3s ease-out infinite}
body[data-state=ready] .ring span:nth-child(2){animation-delay:1s}body[data-state=ready] .ring span:nth-child(3){animation-delay:2s}
@keyframes ping{0%{transform:scale(.55);opacity:.7}100%{transform:scale(1.2);opacity:0}}
.ring .arc{opacity:1;inset:5%;border:4px solid transparent;border-top-color:var(--ac);border-bottom-color:color-mix(in srgb,var(--ac) 30%,transparent);animation:spin 6s linear infinite}
body[data-state=scanning] .ring .arc{animation-duration:.7s}
body[data-state=success] .ring,body[data-state=late] .ring{animation:pop .6s}body[data-state=error] .ring{animation:shake .5s}
.ring .core{opacity:1;inset:19%;background:color-mix(in srgb,var(--ac) 9%,#fff);border:1px solid color-mix(in srgb,var(--ac) 35%,transparent)}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pop{40%{transform:scale(1.14)}}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
.in-wrap{position:relative;width:100%;max-width:500px}
#cardInput{width:100%;padding:16px 22px 16px 56px;border-radius:14px;border:2px solid var(--line);background:#f8fafd;color:var(--tx);font:700 clamp(1rem,1.4vw,1.15rem) 'Tajawal';text-align:center;letter-spacing:2px;transition:.3s}
#cardInput::placeholder{font-weight:400;letter-spacing:.3px;color:#94a3b8}
#cardInput:focus{outline:none;border-color:var(--ac);background:#fff;box-shadow:0 0 0 5px color-mix(in srgb,var(--ac) 16%,transparent)}
.in-wrap i{position:absolute;left:20px;top:50%;transform:translateY(-50%);color:var(--ac);font-size:1.35rem;pointer-events:none}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btns button{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--navy);font:700 .85rem 'Tajawal';cursor:pointer;transition:.25s}
.btns button:hover{background:var(--navy);color:#fff;border-color:var(--navy);transform:translateY(-3px);box-shadow:0 10px 22px rgba(11,34,80,.25)}
/* result */
.result{padding:clamp(16px,2.2vw,32px);display:flex;flex-direction:column;justify-content:center;min-height:320px;animation:up .8s .25s cubic-bezier(.2,.8,.2,1) both;overflow:hidden}
.idle{text-align:center;color:var(--mut);animation:fade 1s both}
.idle i{font-size:clamp(3.5rem,7vw,5.5rem);display:block;margin-bottom:10px;animation:float 3.5s ease-in-out infinite;color:#b8c4dc}
.idle h3{color:var(--tx);font-weight:800;font-size:clamp(1.1rem,2vw,1.6rem);margin-bottom:4px}
@keyframes float{50%{transform:translateY(-12px)}}@keyframes fade{from{opacity:0}}
.loader{text-align:center}
.loader .sp{width:58px;height:58px;border:5px solid var(--line);border-top-color:var(--ac);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
.pass{display:grid;grid-template-columns:auto 1fr;gap:clamp(16px,2.6vw,36px);align-items:center;padding:clamp(16px,2.2vw,32px);border-radius:18px;position:relative;overflow:hidden;color:#fff;
background:linear-gradient(120deg,var(--navy),var(--navy2));border-inline-start:8px solid var(--ac);animation:reveal .7s cubic-bezier(.2,.9,.2,1) both;box-shadow:0 18px 40px rgba(11,34,80,.28)}
@keyframes reveal{from{opacity:0;transform:perspective(900px) rotateX(16deg) translateY(30px) scale(.95)}}
.pass::before{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.16) 50%,transparent 65%);transform:translateX(120%);animation:shine 2.4s .5s ease-out 1 forwards}
@keyframes shine{to{transform:translateX(-120%)}}
.av{width:clamp(90px,13vw,170px);aspect-ratio:1;border-radius:50%;padding:5px;background:var(--ac)}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:4px solid #fff;display:block;transition:filter .8s}
.pass .nm{font-size:clamp(1.2rem,2.8vw,2.3rem);font-weight:900;line-height:1.25;transition:.8s}
.pass .sid{font-family:'Courier New',monospace;letter-spacing:2px;opacity:.75;font-size:clamp(.75rem,1.1vw,.95rem);transition:.8s}
.pass .cn{display:inline-block;margin-top:10px;padding:6px 14px;border-radius:10px;background:rgba(255,255,255,.14);font-family:'Courier New',monospace;letter-spacing:3px;font-size:clamp(.75rem,1.1vw,.95rem)}
.blurred .nm,.blurred .sid{filter:blur(9px);opacity:.35}.blurred .av img{filter:blur(12px)}
.pill{display:inline-flex;align-items:center;gap:7px;margin-bottom:8px;padding:6px 16px;border-radius:99px;font-weight:800;font-size:.9rem;background:var(--ac);color:#fff}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:14px}
.fact{padding:12px 16px;border-radius:14px;background:#f5f8fd;border:1px solid var(--line);animation:fade .6s .3s both}
.fact small{display:block;color:var(--mut);font-size:.75rem;font-weight:600;margin-bottom:2px}
.fact b{font-size:1rem;font-weight:800;color:var(--navy);word-break:break-word}
.fact.wide{grid-column:1/-1}
.timer{position:absolute;bottom:0;right:0;height:4px;background:var(--ac);width:100%;transform-origin:right;animation:drain 15s linear forwards}
@keyframes drain{to{transform:scaleX(0)}}
.errbox{text-align:center;animation:reveal .6s both}
.errbox i{font-size:clamp(3.8rem,8vw,6rem);color:var(--bad);display:block}
.errbox h3{font-weight:900;margin:8px 0 4px;font-size:clamp(1.2rem,2.2vw,1.8rem)}
.errbox .cn{display:inline-block;margin:6px 0;padding:6px 14px;border-radius:10px;background:#fff1f3;color:var(--bad);font-family:'Courier New',monospace;letter-spacing:3px}
.errbox button{margin-top:14px;padding:10px 26px;border-radius:12px;border:0;background:var(--bad);color:#fff;font:800 .95rem 'Tajawal';cursor:pointer;transition:.25s}
.errbox button:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(225,29,72,.35)}
footer{text-align:center;color:var(--mut);font-size:.78rem;padding:10px;border-top:1px solid var(--line);background:#fff}
.toast{position:fixed;top:92px;left:50%;transform:translateX(-50%);z-index:99;min-width:260px;max-width:92vw;padding:14px 22px;border-radius:14px;background:#fff;border:1px solid var(--line);border-right:6px solid var(--ok);display:flex;gap:10px;align-items:center;font-weight:700;font-size:.92rem;box-shadow:0 18px 50px rgba(15,27,51,.25);animation:tin .4s cubic-bezier(.2,.9,.2,1)}
.toast.error{border-right-color:var(--bad)}.toast.warning{border-right-color:var(--warn)}.toast.info{border-right-color:var(--blue)}
.toast.out{animation:tout .3s forwards}
@keyframes tin{from{opacity:0;transform:translate(-50%,-30px)}}@keyframes tout{to{opacity:0;transform:translate(-50%,-30px)}}
/* responsive: full screen on every device */
@media(min-width:1100px){html,body{height:100%;overflow:hidden}.app{height:100dvh}.result{overflow-y:auto}}
@media(max-width:900px){main{grid-template-columns:1fr}.clock{display:none}}
@media(max-width:560px){.pass{grid-template-columns:1fr;text-align:center;justify-items:center;border-inline-start:0;border-top:8px solid var(--ac)}.logo,.sch p{display:none}.fs span{display:none}.fs{padding:0 13px}.ring{width:150px}.btns button{padding:9px 13px;font-size:.78rem}.facts{grid-template-columns:1fr 1fr}}
@media(max-height:560px) and (orientation:landscape){html,body{overflow:auto;height:auto}.app{height:auto}.ring{width:110px}main{grid-template-columns:1fr 1.2fr}}
@media(min-width:1900px){html{font-size:20px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body data-state="ready">
<div class="app">
  <header>
    <img class="logo" src="/Redox.png" alt="Redox" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">
    <span class="logo-fb"><i class="bi bi-hexagon-fill"></i></span>
    <div class="sch">
      <div id="schoolLogoBox"><i class="bi bi-building"></i></div>
      <div style="min-width:0"><h1 id="schoolName">اسم المدرسة</h1><p>بوابة المدخل · تسجيل الحضور بالبطاقة الذكية</p></div>
    </div>
    <div class="clock"><span id="timeDisplay">--:--:--</span><span id="dateDisplay">---</span></div>
    <button class="fs" onclick="toggleFullscreen()" title="ملء الشاشة (F)" aria-label="ملء الشاشة"><i class="bi bi-arrows-fullscreen" id="fullscreenIcon"></i><span id="fsLabel">ملء الشاشة</span></button>
  </header>

  <main>
    <section class="card stage">
      <div class="status" id="scannerStatus"><i class="bi bi-check-circle-fill"></i><span>جاهز لمسح البطاقة</span></div>
      <div class="ring"><span></span><span></span><span></span><span class="core"></span><span class="arc"></span><i class="bi bi-upc-scan ic" id="ringIcon"></i></div>
      <div class="in-wrap">
        <input type="text" id="cardInput" placeholder="امسح البطاقة أو أدخل الرقم يدوياً" autocomplete="off" inputmode="numeric" autofocus>
        <i class="bi bi-credit-card-2-front"></i>
      </div>
      <div class="btns">
        <button onclick="focusScanner()"><i class="bi bi-upc-scan"></i>تركيز الماسح</button>
        <button onclick="manualEntry()"><i class="bi bi-pencil-square"></i>إدخال يدوي</button>
        <button onclick="clearScanner()"><i class="bi bi-arrow-clockwise"></i>إعادة تعيين</button>
      </div>
    </section>

    <section class="card result" id="resultArea">
      <div id="scanResult"></div>
    </section>
  </main>
  <footer>© 2026 Redox Academy — جميع الحقوق محفوظة</footer>
</div>

<script>
let isScanning=false,audioEnabled=true,audioContext=null,privacyTimer=null,logoRetryCount=0;
const MAX_LOGO_RETRIES=5,$=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ===== School data ===== */
function extractIdFromRaw(raw){
  if(!raw)return null;
  try{
    const p=JSON.parse(raw);
    if(p&&typeof p==='object'&&p._id)return p._id;
    if(typeof p==='string'){try{const i=JSON.parse(p);if(i&&i._id)return i._id}catch{if(p.length===24)return p}}
    return null;
  }catch{return raw.length===24?raw:null}
}
function getSchoolId(){
  try{
    for(const k of['school','schoolData']){const id=extractIdFromRaw(localStorage.getItem(k));if(id)return id}
    const d=localStorage.getItem('schoolId');
    return d&&d.length===24?d:null;
  }catch{return null}
}
function getSchoolName(){
  try{
    let p=JSON.parse(localStorage.getItem('school')||'null');
    if(typeof p==='string')p=JSON.parse(p);
    return p&&p.name?p.name:'';
  }catch{return ''}
}

/* ===== Audio ===== */
function initAudio(){
  if(!audioContext&&audioEnabled){try{audioContext=new(window.AudioContext||window.webkitAudioContext)()}catch{}}
  return audioContext;
}
function playBeep(f,d,v=.15){
  if(!audioEnabled)return;
  try{
    const c=initAudio();if(!c||c.state==='closed')return;
    if(c.state==='suspended')c.resume();
    const o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.value=f;g.gain.value=v;
    o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.stop(c.currentTime+d);
  }catch{}
}
const seq=(notes,d,v)=>notes.forEach((f,i)=>setTimeout(()=>playBeep(f,d,v),i*150));
const playScanSound=()=>playBeep(800,.2);
const playSuccessSound=()=>seq([1046,1318,1568],.2);
const playErrorSound=()=>seq([440,349],.3);
const playWelcomeSound=()=>seq([523,587,659,784],.2);
const playCompletionSound=()=>seq([880,1108,1318],.18,.2);
document.addEventListener('click',()=>{if(audioContext&&audioContext.state==='suspended')audioContext.resume()},{once:true});

/* ===== Clock ===== */
function updateDateTime(){
  const n=new Date();
  $('timeDisplay').textContent=n.toLocaleTimeString('en-GB');
  $('dateDisplay').textContent=n.toLocaleDateString('ar-DZ',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
}

/* ===== State (colors + ring + status chip) ===== */
function updateStatus(text,state,icon,ringIcon){
  document.body.dataset.state=state;
  $('scannerStatus').innerHTML=`<i class="bi ${icon}"></i><span>${text}</span>`;
  $('ringIcon').className=`bi ${ringIcon||'bi-upc-scan'} ic`;
}
const ready=()=>updateStatus('جاهز لمسح البطاقة','ready','bi-check-circle-fill','bi-upc-scan');

/* ===== Privacy ===== */
function applyPrivacyBlur(){document.querySelector('.pass')?.classList.add('blurred')}
function removePrivacyBlur(){document.querySelector('.pass')?.classList.remove('blurred')}
function startPrivacyTimer(){
  clearTimeout(privacyTimer);
  privacyTimer=setTimeout(()=>{
    applyPrivacyBlur();playCompletionSound();
    $('scanResult').innerHTML=`<div class="idle"><i class="bi bi-shield-check"></i><h3>تم إخفاء البيانات للخصوصية</h3><p>جاهز للبطاقة التالية</p></div>`;
    ready();privacyTimer=null;
  },15000);
}

/* ===== Idle ===== */
function showIdle(){
  $('scanResult').innerHTML=`<div class="idle"><i class="bi bi-person-badge"></i><h3>قرّب البطاقة من القارئ</h3><p>ستظهر بيانات الطالب وحالة الحضور هنا</p></div>`;
}

/* ===== Student view ===== */
function getAcademicYearName(c){
  const m={'1AS':'الأولى ثانوي','2AS':'الثانية ثانوي','3AS':'الثالثة ثانوي','1MS':'الأولى متوسط','2MS':'الثانية متوسط','3MS':'الثالثة متوسط','4MS':'الرابعة متوسط','5MS':'الخامسة متوسط','1AP':'الأولى ابتدائي','2AP':'الثانية ابتدائي','3AP':'الثالثة ابتدائي','4AP':'الرابعة ابتدائي','5AP':'الخامسة ابتدائي','NS':'غير محدد'};
  return m[c]||c||'غير محدد';
}
function displayStudentInfo(student,classInfo=null,attendance=null){
  const st=attendance?.status||'present';
  const txt=st==='present'?'حاضر':st==='late'?'متأخر':'غائب';
  const ic=st==='present'?'bi-check-circle-fill':st==='late'?'bi-exclamation-triangle-fill':'bi-x-circle-fill';
  const state=st==='present'?'success':st==='late'?'late':'error';
  const av=student.avatarUrl||`https://ui-avatars.com/api/?name=${encodeURIComponent(student.name)}&background=143a82&color=fff&size=200&bold=true&length=2`;
  const raw=String(student.cardUid||('**** **** **** '+(student.studentId?.slice(-4)||'0000')));
  const cn=raw.match(/.{1,4}/g)?.join(' ')||raw;
  const t=attendance?.time?new Date(attendance.time).toLocaleTimeString('en-GB'):'';
  const cls=classInfo?`
    <div class="fact"><small>الحصة</small><b>${esc(classInfo.name||'غير محدد')}</b></div>
    <div class="fact"><small>المادة</small><b>${esc(classInfo.subject||'غير محدد')}</b></div>
    ${classInfo.teacher?`<div class="fact"><small>الأستاذ</small><b>${esc(classInfo.teacher.name||classInfo.teacher)}</b></div>`:''}`
    :`<div class="fact"><small>الحصص</small><b>لا توجد حصص حالياً</b></div>`;
  $('scanResult').innerHTML=`
    <div class="pass">
      <div class="av"><img src="${esc(av)}" alt="" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(student.name)}&background=143a82&color=fff&size=200&bold=true'"></div>
      <div>
        <div class="pill"><i class="bi ${ic}"></i>${txt}${t?` · ${t}`:''}</div>
        <div class="nm">${esc(student.name)}</div>
        <div class="sid">رقم الطالب: ${esc(student.studentId||'غير محدد')}</div>
        <span class="cn"><i class="bi bi-credit-card-2-front"></i> ${esc(cn)}</span>
      </div>
      <div class="timer"></div>
    </div>
    <div class="facts">
      ${cls}
      <div class="fact"><small>ولي الأمر</small><b>${esc(student.parentName||'غير محدد')}</b></div>
      <div class="fact wide"><small>السنة الدراسية</small><b>${esc(getAcademicYearName(student.academicYear))}</b></div>
    </div>`;
  updateStatus(st==='late'?'تم التسجيل — متأخر':st==='present'?'تم التسجيل بنجاح':'غائب',state,ic,ic);
  startPrivacyTimer();
}

/* ===== Process card ===== */
async function processCard(cardUid){
  if(isScanning)return;
  try{
    isScanning=true;
    const clean=cardUid.toString().trim();
    if(clean.length<4)throw new Error('رقم البطاقة غير مكتمل');
    clearTimeout(privacyTimer);
    updateStatus('جاري التعرف على البطاقة...','scanning','bi-arrow-repeat','bi-wifi');
    playScanSound();
    $('scanResult').innerHTML=`<div class="loader"><div class="sp"></div><h4>جاري المعالجة...</h4><p style="color:var(--mut)">يرجى الانتظار</p></div>`;
    const res=await fetch('/api/attendance/card-scan-enhanced',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({cardUid:clean,sendSMS:false,checkPayments:false,checkRegistration:false})
    });
    const data=await res.json();
    if(data.success){
      const student=data.data?.student;
      if(student){
        displayStudentInfo(student,data.data?.class,data.data?.attendance);
        playSuccessSound();
        showToast('success',`تم تسجيل حضور الطالب ${student.name} بنجاح`);
      }else showErrorResult('بيانات الطالب غير مكتملة');
    }else{
      if(data.error&&data.error.includes('بطاقة غير مسجلة'))handleUnknownCard(clean);
      else handleFailedAttendance(data);
    }
  }catch(err){
    console.error(err);handleUnknownCard(cardUid);
  }finally{
    isScanning=false;
    $('cardInput').value='';$('cardInput').focus();
    setTimeout(()=>{if(!isScanning&&!privacyTimer)ready()},4000);
  }
}

/* ===== Errors ===== */
function errorCard(icon,title,body,extra=''){
  $('scanResult').innerHTML=`<div class="errbox"><i class="bi ${icon}"></i><h3>${title}</h3>${extra}<p style="color:var(--mut)">${body}</p>
  <button onclick="clearScanner()"><i class="bi bi-arrow-clockwise"></i> إعادة المحاولة</button></div>`;
}
function handleUnknownCard(uid){
  errorCard('bi-exclamation-triangle-fill','بطاقة غير معروفة','هذه البطاقة غير مسجلة في النظام',`<div class="cn">${esc(uid)}</div>`);
  updateStatus('بطاقة غير معروفة','error','bi-exclamation-triangle-fill','bi-exclamation-lg');
  playErrorSound();
}
function handleFailedAttendance(d){
  showErrorResult(d.error||'حدث خطأ أثناء التسجيل');
  playErrorSound();
  updateStatus('فشل التسجيل','error','bi-exclamation-triangle-fill','bi-x-lg');
}
function showErrorResult(m){errorCard('bi-x-circle-fill','حدث خطأ',esc(m))}

/* ===== Toast ===== */
function showToast(type,msg){
  const t=document.createElement('div');
  const ic={success:'bi-check-circle-fill text-ok',warning:'bi-exclamation-triangle-fill',error:'bi-exclamation-triangle-fill',info:'bi-info-circle-fill'}[type]||'bi-info-circle-fill';
  t.className=`toast ${type}`;
  t.innerHTML=`<i class="bi ${ic.split(' ')[0]}" style="color:${type==='error'?'var(--red)':type==='warning'?'var(--amber)':type==='info'?'var(--blue)':'var(--teal)'}"></i><span>${esc(msg)}</span>`;
  document.body.appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),300)},4000);
}

/* ===== Controls ===== */
function focusScanner(){$('cardInput').focus();showToast('info','الماسح الضوئي جاهز')}
function manualEntry(){$('cardInput').focus();showToast('info','أدخل رقم البطاقة ثم اضغط Enter')}
function clearScanner(){
  clearTimeout(privacyTimer);privacyTimer=null;
  $('cardInput').value='';showIdle();$('cardInput').focus();ready();
}
function toggleFullscreen(){
  if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>showToast('error','تعذر تكبير الشاشة'));
  else document.exitFullscreen?.();
}
document.addEventListener('fullscreenchange',()=>{
  const f=!!document.fullscreenElement;$('fullscreenIcon').className=f?'bi bi-fullscreen-exit':'bi bi-arrows-fullscreen';$('fsLabel').textContent=f?'إنهاء ملء الشاشة':'ملء الشاشة';
});

/* ===== Scanner input ===== */
function setupScanner(){
  const input=$('cardInput');let buffer='',timeout=null;
  input.addEventListener('keypress',e=>{
    if(e.key==='Enter'){e.preventDefault();const v=e.target.value.trim();if(v.length>=4)processCard(v)}
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape')clearScanner();
    if((e.key==='f'||e.key==='F')&&e.target.tagName!=='INPUT')toggleFullscreen();
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
    if(e.key>='0'&&e.key<='9'){
      e.preventDefault();buffer+=e.key;input.value=buffer;
      clearTimeout(timeout);
      timeout=setTimeout(()=>{if(buffer.length>=4)processCard(buffer);buffer='';input.value=''},80);
    }
  });
  document.addEventListener('click',e=>{if(!e.target.closest('button'))input.focus()});
}

/* ===== School logo ===== */
async function fetchSchoolLogo(){
  const box=$('schoolLogoBox'),fb='<i class="bi bi-building"></i>';
  const id=getSchoolId();
  if(!id||!/^[0-9a-fA-F]{24}$/.test(id)){box.innerHTML=fb;return}
  box.classList.add('loading');box.innerHTML='';
  try{
    const res=await fetch(`/api/school/${id}/logo`,{headers:{Accept:'application/json'}});
    if(!res.ok)throw new Error(`HTTP ${res.status}`);
    const data=await res.json();
    box.classList.remove('loading');
    if(data.success&&data.data&&data.data.logo){
      const img=document.createElement('img');
      img.alt='شعار المدرسة';img.onerror=()=>{box.innerHTML=fb};img.src=data.data.logo;
      box.innerHTML='';box.appendChild(img);logoRetryCount=0;
    }else box.innerHTML=fb;
  }catch(err){
    box.classList.remove('loading');box.innerHTML=fb;
    if(++logoRetryCount<MAX_LOGO_RETRIES)setTimeout(fetchSchoolLogo,3000*logoRetryCount);
  }
}

/* ===== Init ===== */
function initApp(){
  const name=getSchoolName().trim();
  $('schoolName').textContent=name||'اسم المدرسة غير محدد';
  if(name)document.title=`${name} | Redox`;
  updateDateTime();setInterval(updateDateTime,1000);
  setupScanner();showIdle();fetchSchoolLogo();
  setTimeout(playWelcomeSound,500);
}
document.addEventListener('DOMContentLoaded',initApp);
</script>
